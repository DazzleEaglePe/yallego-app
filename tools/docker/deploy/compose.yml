name: yallego-${DEPLOY_ENV:-staging}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?Define POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Define POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yallego}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Define APP_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [data]

  migrate:
    image: ${MIGRATIONS_IMAGE:-yallego-migrations:local}
    environment: &api-environment
      NODE_ENV: production
      LOG_LEVEL: ${DEPLOY_LOG_LEVEL:-info}
      PORT: 3001
      DATABASE_URL: postgresql://yallego_app:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-yallego}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_SUPERUSER}:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/${POSTGRES_DB:-yallego}
      REDIS_URL: redis://redis:6379
      DASHBOARD_URL: ${PUBLIC_URL:?Define PUBLIC_URL}
      JWT_ISSUER: ${PUBLIC_URL:?Define PUBLIC_URL}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Define JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Define JWT_PUBLIC_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Define ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-no-reply@yallego.app}
      PLATFORM_ALLOWED_IPS: ${PLATFORM_ALLOWED_IPS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [data]

  api:
    image: ${API_IMAGE:-yallego-api:local}
    environment: *api-environment
    expose: ['3001']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge, data]

  dashboard:
    image: ${DASHBOARD_IMAGE:-yallego-dashboard:local}
    expose: ['3000']
    restart: unless-stopped
    networks: [edge]

  proxy:
    image: ${PROXY_IMAGE:-yallego-proxy:local}
    environment:
      SERVER_NAME: ${SERVER_NAME:?Define SERVER_NAME}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ${TLS_FULLCHAIN_PATH:?Define TLS_FULLCHAIN_PATH}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:?Define TLS_PRIVATE_KEY_PATH}:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge]

  prometheus:
    image: prom/prometheus:v3.10.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [edge, observability]

  loki:
    image: grafana/loki:3.7.4
    command: ['-config.file=/etc/loki/config.yml']
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks: [observability]

  docker-socket-proxy:
    image: ghcr.io/wollomatic/socket-proxy:1.13.1@sha256:e78e68ba3ea4a6bf8ee47865ac1d1f98d525c3660df948554e766283c40d3f4b
    command:
      - -listenip=0.0.0.0
      - -allowfrom=alloy
      - -allowGET=/_ping
      - -allowHEAD=/_ping
      - -allowGET=/v[0-9.]+/version
      - -allowGET=/v[0-9.]+/containers/json
      - -allowGET=/v[0-9.]+/containers/[a-zA-Z0-9]+/json
      - -allowGET=/v[0-9.]+/containers/[a-zA-Z0-9]+/logs
      - -allowGET=/v[0-9.]+/events
      - -allowGET=/v[0-9.]+/networks
      - -allowGET=/v[0-9.]+/networks/[a-zA-Z0-9]+
      - -watchdoginterval=60
      - -stoponwatchdog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # El grupo numérico del socket varía por host; root solo abre el socket.
    # La superficie efectiva sigue limitada por métodos/rutas, red y caps.
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    restart: unless-stopped
    networks: [docker-socket]

  alloy:
    image: grafana/alloy:v1.18.0
    command: ['run', '--server.http.listen-addr=0.0.0.0:12345', '/etc/alloy/config.alloy']
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV:-staging}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - docker-socket-proxy
    restart: unless-stopped
    networks: [observability, docker-socket]

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3002}:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/api/health | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [edge, observability]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  edge:
  data:
    internal: true
  observability:
    internal: true
  docker-socket:
    internal: true
