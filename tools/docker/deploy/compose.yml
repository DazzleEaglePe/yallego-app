name: yallego-${DEPLOY_ENV:-staging}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?Define POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Define POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-yallego}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Define APP_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [data]

  migrate:
    image: ${MIGRATIONS_IMAGE:-yallego-migrations:local}
    environment: &api-environment
      NODE_ENV: production
      LOG_LEVEL: ${DEPLOY_LOG_LEVEL:-info}
      PORT: 3001
      DATABASE_URL: postgresql://yallego_app:${APP_DATABASE_PASSWORD}@postgres:5432/${POSTGRES_DB:-yallego}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_SUPERUSER}:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/${POSTGRES_DB:-yallego}
      REDIS_URL: redis://redis:6379
      DASHBOARD_URL: ${PUBLIC_URL:?Define PUBLIC_URL}
      JWT_ISSUER: ${PUBLIC_URL:?Define PUBLIC_URL}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Define JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Define JWT_PUBLIC_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Define ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:-no-reply@yallego.app}
      PLATFORM_ALLOWED_IPS: ${PLATFORM_ALLOWED_IPS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [data]

  api:
    image: ${API_IMAGE:-yallego-api:local}
    environment: *api-environment
    expose: ['3001']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge, data]

  dashboard:
    image: ${DASHBOARD_IMAGE:-yallego-dashboard:local}
    expose: ['3000']
    restart: unless-stopped
    networks: [edge]

  proxy:
    image: ${PROXY_IMAGE:-yallego-proxy:local}
    environment:
      SERVER_NAME: ${SERVER_NAME:?Define SERVER_NAME}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ${TLS_FULLCHAIN_PATH:?Define TLS_FULLCHAIN_PATH}:/etc/nginx/certs/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:?Define TLS_PRIVATE_KEY_PATH}:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge]

volumes:
  postgres-data:
  redis-data:

networks:
  edge:
  data:
    internal: true
